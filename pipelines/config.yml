core:
  redis:
    nonpersistent:
      host: localhost
      port: 6379
    persistent:
      host: localhost
      port: 6379

datastore:
  hosts: ["http://elastic:devpass@localhost:9200"]

filestore:
  cache:
    [
      "s3://al_storage_key:Ch@ngeTh!sPa33w0rd@localhost:9000?s3_bucket=al-cache&use_ssl=False",
    ]
  storage:
    [
      "s3://al_storage_key:Ch@ngeTh!sPa33w0rd@localhost:9000?s3_bucket=al-storage&use_ssl=False",
    ]

logging:
  log_as_json: false
  log_to_console: true
  log_to_file: false
  log_to_syslog: false

submission:
  file_sources:
    - name: "alpytest"
      auto_select: true
      hash_types: [test_hash]
      hash_patterns:
        test_hash: "^\/pytest\/stable\\.json$"
      replace_pattern: "{HASH}"
      url: https://alpytest.blob.core.windows.net/{HASH}

ui:
  enforce_quota: false
