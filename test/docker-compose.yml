version: "2.4"

services:
  al_frontend:
    image: cccs/assemblyline-ui-frontend:${TAG:-latest}
    ports:
      - "3000:3000"

  al_ui:
    image: cccs/assemblyline-ui:${TAG:-latest}
    environment:
      WORKERS: 1
      THREADS: 1
    volumes:
      - ${PATH_REWRITE:-.}/config/:/etc/assemblyline/
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    extra_hosts:
      - "localhost:host-gateway"

  al_socketio:
    image: cccs/assemblyline-socketio:${TAG:-latest}
    volumes:
      - ${PATH_REWRITE:-.}/config/:/etc/assemblyline/
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    extra_hosts:
      - "localhost:host-gateway"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.3
    environment:
      - xpack.security.enabled=true
      - discovery.type=single-node
      - logger.level=WARN
      - "ELASTIC_PASSWORD=devpass"
      - "ES_JAVA_OPTS=-Xms1024m -Xmx1024m"
    ports:
      - "9200:9200"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --silent --fail http://elastic:devpass@localhost:9200/_cluster/health || exit 1",
        ]
      interval: 30s
      timeout: 30s
      retries: 3

  redis:
    image: redis
    ports:
      - "6380:6379"
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: cccs/nginx-ssl-frontend
    environment:
      TEMPLATE: minimal
    ports:
      - "443:443"
    depends_on:
      al_ui:
        condition: service_started
      al_socketio:
        condition: service_started

  minio:
    image: minio/minio
    environment:
      MINIO_ACCESS_KEY: al_storage_key
      MINIO_SECRET_KEY: Ch@ngeTh!sPa33w0rd
    ports:
      - "9000:9000"
    command: server /data

  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    environment:
      - KC_HEALTH_ENABLED=true
    volumes:
      - ${PATH_REWRITE:-.}/config/keycloak-realm.json:/opt/keycloak/data/import/realm.json
    command: start-dev --import-realm
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "{ printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 10s
